services:
  postgres:
    image: postgres:16
    container_name: steam-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: ./etl
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  eda:
    build: ./eda
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3838:3838"
    restart: unless-stopped
    # This one only on development to see changes without rebuild
    volumes:
      - ./eda:/srv/shiny-server

  crud:
    build: ./database/crud
    container_name: steam-crud
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: steam-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - crud
    volumes:
      - ./frontend/public:/usr/share/nginx/html

volumes:
  postgres_data: