<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database CRUD - Steam Insights</title>
  <script src="/js/auth-guard.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/crud/css/crud.css">
  <link rel="icon" type="image/svg+xml" href="/img/database.svg">
</head>
<body>

  <header class="navbar">
    <a href="/index.html" class="logo-link">
      <div class="logo">Steam <span class="logo-accent">Insights</span></div>
    </a>
    <button id="logout-btn" class="btn-logout">Log Out</button>
  </header>

  <main class="container">
    
    <div class="crud-header">
      <h1>Database Management</h1>
    </div>

    <div class="controls-row">
      <nav class="crud-tabs">
        <button class="tab-btn active" data-entity="games">Games</button>
        <button class="tab-btn" data-entity="achievements">Achievements</button>
        <button class="tab-btn" data-entity="users">Users</button>
        <details class="dropdown-details">
          <summary class="tab-btn dropdown-toggle">
            <i data-lucide="more-vertical"></i>
          </summary>
          <div class="dropdown-menu">
            <button class="dropdown-item" data-entity="user_games">User Games</button>
            <button class="dropdown-item" data-entity="user_achievements">User Achievements</button>
          </div>
        </details>
      </nav>

      <form id="query-form" class="query-bar">
        <div class="input-wrapper">
          <span class="query-icon"><i data-lucide="terminal"></i></span>
          <input type="text" id="query-input" placeholder="SELECT * FROM games LIMIT 100;" autocomplete="off" spellcheck="false" required>
        </div>
        <button type="submit" class="btn-primary">Execute</button>
      </form>
    </div>

    <section class="table-card">
      <div class="table-responsive">
        <table class="crud-table">
          <thead>
            <tr id="table-headers">
              <th>Info</th>
              <th style="width: 80px; text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="empty-row">
              <td colspan="2">Data havent been loaded.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="pagination-container" class="pagination-container">
      
    </section>

    <!-- View -->
    <dialog id="view-modal" class="modal">
      <div class="modal-content">
        <h3>Details</h3>
        <div id="view-modal-body"></div>
        <button type="button" onclick="document.getElementById('view-modal').close()">Exit</button>
      </div>
    </dialog>

    <!-- Edit -->
    <dialog id="edit-modal" class="modal">
      <div class="modal-content">
        <h3>Edit</h3>
        <form id="edit-form">
          <div id="edit-form-body"></div>
          <button type="submit">Save Changes</button>
          <button type="button" onclick="document.getElementById('edit-modal').close()">Cancel</button>
        </form>
      </div>
    </dialog>

  </main>

  <script src="/js/logout.js"></script>
  <script type="module" src="/crud/js/main.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
