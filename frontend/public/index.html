<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Insights</title>
  <script src="/js/auth-guard.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Steam Insights</div>
    <button id="logout-btn" class="btn-logout">Log Out</button>
  </header>

  <main class="container">
    <section class="welcome-section">
      <h1>Control Panel</h1>
      <p>Select the module you want to access:</p>
    </section>

    <div class="grid-services">

      <a href="/crud/index.html" id="card-crud" class="card active">
        <div id="badge-crud" class="badge status-checking" data-endpoint="/health">Checking...</div>
        <div class="card-icon">
            <i data-lucide="database"></i>
        </div>
        <h2>Database CRUD</h2>
        <p>Lorem ipsum yada yada</p>
        <span class="tech-tag scala">Scala / http4s</span>
      </a>

      <a href="/dashboard/index.html" id="card-dashboard" class="card active">
        <div id="badge-dashboard" class="badge status-checking" data-endpoint="/dashboard/health">Checking...</div>
        <div class="card-icon">
          <i data-lucide="layout-dashboard"></i>
        </div>
        <h2>Dashboard</h2>
        <p>Ipsum lorde bla bla and that</p>
        <span class="tech-tag r">R / Shiny</span>
      </a>

      <a href="/ml/index.html" id="card-ml" class="card active">
        <div id="badge-ml" class="badge status-checking" data-endpoint="/ml/health">Checking...</div>
        <div class="card-icon">
          <i data-lucide="brain"></i>
        </div>
        <h2>Machine Learning</h2>
        <p>machine learning models and stuff</p>
        <span class="tech-tag python">Python / Scikit-Learn</span>
      </a>

    </div>
  </main>

  <script src="/js/health-check.js"></script>
  <script src="/js/logout.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
